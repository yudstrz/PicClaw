name: picclaw
description: A local-first, privacy-focused gallery cleaning utility app.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.0

  # Media Access
  photo_manager: ^3.0.0

  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  isar: ^3.1.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
